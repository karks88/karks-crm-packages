name: Deploy to WordPress.org SVN

# Triggered by pushing a tag like v0.9.10.3 (same trigger as release.yml), so
# the GitHub Release and the WordPress.org SVN push happen from the same
# tagged commit. workflow_dispatch lets an already-existing tag (e.g. the
# first WordPress.org release) be (re-)deployed without re-tagging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy (e.g. v1.2.1)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The action derives VERSION from GITHUB_REF, which on workflow_dispatch
      # is the branch (refs/heads/main), not the tag being deployed. Resolve
      # it from the tag explicitly so both triggers produce e.g. "1.2.1".
      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # SVN only reports "Authentication failed" at the final commit, so catch
      # missing or mis-pasted secrets up front. Prints lengths, never values.
      - name: Check SVN credentials
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          ok=1
          for name in SVN_USERNAME SVN_PASSWORD; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty or not visible to this workflow (must be a repository Actions secret)."
              ok=0
              continue
            fi
            echo "$name is set (${#value} characters)."
            if [[ "$value" =~ [[:space:]] ]]; then
              echo "::error::$name contains whitespace or a newline; re-paste it."
              ok=0
            fi
          done
          if [[ "$SVN_USERNAME" == *@* ]]; then
            echo "::error::SVN_USERNAME looks like an email; use your WordPress.org username."
            ok=0
          fi
          [ "$ok" = 1 ]

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: karks-crm-packages
          VERSION: ${{ steps.version.outputs.version }}
          ASSETS_DIR: .wordpress-org
